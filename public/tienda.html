<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --pri:#7A6E5C; --sec:#B39A6E; --ink:#20232a; --mut:#8a8f99; --line:#ecebe7; --bg:#ffffff; --soft:#f6f4ef; }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  section{scroll-margin-top:64px}
  body{margin:0;font-family:'Jost',system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  a{color:inherit;text-decoration:none}
  .topbar{background:#111;color:#fff;font-size:12.5px;letter-spacing:.4px;padding:9px 20px;font-weight:400;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .topbar b{font-weight:700}
  .topbar .links{position:absolute;right:20px;display:flex;gap:18px;font-size:12px}
  @media(max-width:640px){.topbar .links{display:none}}
  .topwrap{position:relative}
  .marquee{background:#7a1220;color:#fff;overflow:hidden;white-space:nowrap;font-weight:700;letter-spacing:1px;font-size:13.5px;text-transform:uppercase}
  .marquee > span{display:inline-block;padding:9px 0;animation:scroll-left 22s linear infinite}
  .marquee > span > i{font-style:normal;padding:0 40px}
  @keyframes scroll-left{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  header.hd{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:12px}
  header.hd .logo{height:48px;width:auto;display:block}
  header.hd .nm{font-size:22px;font-weight:600;letter-spacing:3px;text-transform:uppercase}
  nav.catnav{position:sticky;top:0;z-index:19;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;padding:11px 16px;-webkit-overflow-scrolling:touch}
  nav.catnav::-webkit-scrollbar{display:none}
  nav.catnav a{font-size:13px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:var(--ink);white-space:nowrap;padding:6px 12px;border-radius:20px;transition:.15s}
  nav.catnav a:hover{background:var(--soft);color:var(--pri)}
  nav.catnav a.hot{background:var(--pri);color:#fff}
  /* Hero carrusel */
  .hero{position:relative;max-width:1180px;margin:20px auto 6px;border-radius:16px;overflow:hidden;aspect-ratio:16/6.6;background:var(--soft)}
  @media(max-width:640px){.hero{aspect-ratio:16/11;margin:12px}}
  .hero .slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s ease;display:flex;align-items:center}
  .hero .slide.on{opacity:1}
  .hero .slide::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.15) 55%,transparent)}
  .hero .cap{position:relative;color:#fff;padding:0 clamp(20px,5vw,64px);max-width:60%}
  .hero .cap h2{font-size:clamp(22px,3.4vw,40px);font-weight:600;line-height:1.1;margin:0 0 8px;letter-spacing:.5px}
  .hero .cap p{font-size:clamp(13px,1.5vw,17px);margin:0 0 16px;opacity:.95;font-weight:300}
  .hero .cap a{display:inline-block;background:#fff;color:var(--ink);padding:11px 22px;border-radius:24px;font-weight:600;font-size:13px;letter-spacing:.5px}
  .hero .dots{position:absolute;bottom:14px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:2}
  .hero .dots i{width:8px;height:8px;border-radius:50%;background:#ffffff8c;cursor:pointer;transition:.2s}
  .hero .dots i.on{background:#fff;width:22px;border-radius:5px}
  /* Banner de sección */
  .secbanner{position:relative;max-width:1180px;margin:34px auto 6px;border-radius:14px;overflow:hidden;height:200px;background:var(--soft);display:flex;align-items:center}
  .secbanner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
  .secbanner::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 55%,transparent)}
  .secbanner .t{position:relative;z-index:2;color:#fff;padding:0 clamp(20px,5vw,52px)}
  .secbanner .t h3{font-size:clamp(20px,3vw,30px);font-weight:600;letter-spacing:1px;margin:0;text-transform:uppercase}
  .wrap{max-width:1180px;margin:0 auto;padding:10px 20px 90px}
  .sec-title{font-size:15px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--ink);margin:34px 0 4px;text-align:center}
  .sec-rule{width:44px;height:2px;background:var(--sec);margin:0 auto 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.18s;cursor:pointer}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.08);border-color:#e2ded4}
  .pimg{position:relative;width:100%;aspect-ratio:1;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pimg img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain}
  .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .ph svg{width:44%;height:44%;opacity:.5}
  .pinfo{padding:14px 15px 16px;display:flex;flex-direction:column;flex:1}
  .chip{font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--sec)}
  .pname{font-size:15px;font-weight:500;margin:3px 0 2px;line-height:1.3}
  .size{font-size:12px;color:var(--mut);margin-bottom:8px}
  .price{font-size:18px;font-weight:600;margin-top:auto}
  .add{margin-top:12px;width:100%;border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:10px;padding:10px;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:.15s}
  .add:hover{background:var(--ink);color:#fff}
  .btn{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-family:inherit;font-weight:600;font-size:14px;background:var(--pri);color:#fff}
  .btn:hover{filter:brightness(1.06)} .btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.block{width:100%} .btn:disabled{opacity:.5;cursor:not-allowed}
  input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px;font-weight:500}
  .modal-bg{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:40}
  .modal-bg.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:22px;max-height:92vh;overflow:auto}
  @media(min-width:640px){.modal-bg{align-items:center}.sheet{border-radius:16px}}
  .sheet h3{margin:0 0 4px;font-weight:600}
  .cartbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:none;align-items:center;justify-content:space-between;z-index:30;box-shadow:0 -4px 20px #0000000f}
  .cartbar.show{display:flex}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .citem{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .qty{display:flex;align-items:center;gap:10px}.qty button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
  .muted{color:var(--mut)} .center{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;z-index:50}
  .toast.show{opacity:1}
  .err{color:#c0392b;font-size:13px;margin-top:8px}
  .powered{text-align:center;color:var(--mut);font-size:11.5px;letter-spacing:.5px;margin-top:44px}
</style>
</head>
<body>
<div id="root"><div class="center"><div class="muted">Cargando tienda…</div></div></div>
<div id="toast" class="toast"></div>

<script>
const slug = (location.pathname.match(/^\/t\/([a-z0-9][a-z0-9-]{0,62})/i) || [])[1]
  || new URLSearchParams(location.search).get('tenant') || '';
let TENANT=null, PRODUCTS=[], cart=[];

const BOTTLE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" style="color:var(--pri)"><rect x="7.5" y="9" width="9" height="12" rx="1.6"/><rect x="10" y="5.5" width="4" height="3.5"/><rect x="10.3" y="2.6" width="3.4" height="3" rx="1"/><line x1="9.7" y1="13" x2="14.3" y2="13"/></svg>`;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(c){return '$'+((Number(c)||0)/100).toLocaleString('es-AR',{minimumFractionDigits:0})}
function toast(m){const t=$('toast');t.textContent=m;t.className='toast show';setTimeout(()=>t.className='toast',2200)}

async function init(){
  if(!slug){ return renderError('Falta el identificador de la tienda.'); }
  try{
    const r = await fetch('/api/storefront?tenant='+encodeURIComponent(slug));
    if(!r.ok){ return renderError('Tienda no encontrada.'); }
    const d = await r.json();
    TENANT=d.tenant; PRODUCTS=d.products||[];
    document.documentElement.style.setProperty('--pri',TENANT.primary_color||'#7A6E5C');
    document.documentElement.style.setProperty('--sec',TENANT.secondary_color||'#B39A6E');
    document.title = TENANT.name;
    setFavicon();
    renderStore();
  }catch(e){ renderError('No se pudo cargar la tienda.'); }
}
function renderError(msg){ $('root').innerHTML='<div class="center"><div><h2>Ups</h2><p class="muted">'+esc(msg)+'</p></div></div>'; }
function setFavicon(){
  const href=`/assets/${slug}/favicon.png`;
  const probe=new Image();
  probe.onload=()=>{ ['icon','apple-touch-icon'].forEach(rel=>{ let l=document.querySelector(`link[rel="${rel}"]`); if(!l){l=document.createElement('link');l.rel=rel;document.head.appendChild(l);} l.href=href; }); };
  probe.src=href;
}

function cardHTML(p,i){
  const img = `/assets/${esc(slug)}/${esc(p.slug)}.jpg`;
  return `<div class="card" onclick="openCust(${i})">
    <div class="pimg"><div class="ph">${BOTTLE_SVG}</div><img src="${img}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'"></div>
    <div class="pinfo">
      <div class="chip">${esc(p.category||'')}</div>
      <div class="pname">${esc(p.name)}</div>
      <div class="size">${esc(p.size_description||'')}</div>
      <div class="price">${money(p.price)}</div>
      <button class="add" onclick="event.stopPropagation();openCust(${i})">Agregar al carrito</button>
    </div>
  </div>`;
}

// Orden preferido de categorías (las fragancias primero, como en las perfumerías).
const CAT_ORDER = ['Conjuntos de Fútbol','Conjuntos Deportivos','Camperas de Gimnasia','Camperas Rompevientos','Fragancias Femeninas','Fragancias Masculinas','Fragancias para Niños','Agua de Colonia','Cuidado Bebés','Cuidado del Cabello','Cuidado Facial','Línea Patagonia','Cuidado Corporal','Cremas Corporales','Cuidado de Manos','Cuidado Solar','Lip Care','Cuidado Capilar','Aceites Esenciales','Aceites Cosmetológicos','Cream Oil','Aromatizantes de Ambiente','Difusores y Hornillo','Aroma para Tela y Cama','Aroma para el Auto','Lavado y Enjuague','Bienestar','Accesorios'];
function catRank(c){ const i=CAT_ORDER.indexOf(c); return i<0?999:i; }

function renderStore(){
  const logo = TENANT.logo_url ? `<img class="logo" src="${esc(TENANT.logo_url)}" alt="${esc(TENANT.name)}">` : `<span class="nm">${esc(TENANT.name)}</span>`;
  // agrupar por categoría y ordenar según CAT_ORDER
  const byCat={};
  PRODUCTS.forEach((p,i)=>{ const c=p.category||'Productos'; (byCat[c]||(byCat[c]=[])).push(i); });
  const cats = Object.keys(byCat).sort((a,b)=>catRank(a)-catRank(b) || a.localeCompare(b));
  const nav = cats.length
    ? `<nav class="catnav">${cats.map((c,ci)=>`<a href="#cat${ci}" class="${/Fragancias/.test(c)?'hot':''}">${esc(c)}</a>`).join('')}</nav>` : '';
  const BANNER = {'Fragancias Femeninas':'banner-femeninas.jpg','Fragancias Masculinas':'banner-masculinas.jpg','Fragancias para Niños':'banner-ninos.jpg'};
  const sections = PRODUCTS.length
    ? cats.map((c,ci)=>{
        const b = BANNER[c] ? `<div class="secbanner"><img src="/assets/${esc(slug)}/${BANNER[c]}" alt="${esc(c)}" onerror="this.closest('.secbanner').remove()"><div class="t"><h3>${esc(c)}</h3></div></div>` : '';
        return `<section id="cat${ci}">${b}<div class="sec-title">${esc(c)}</div><div class="sec-rule"></div>
        <div class="grid">${byCat[c].map(i=>cardHTML(PRODUCTS[i],i)).join('')}</div></section>`;
      }).join('')
    : '<p class="muted" style="text-align:center;margin-top:40px">Esta tienda todavía no cargó productos.</p>';
  // Hero (imágenes por tenant en /assets/<slug>/heroN.jpg; se ocultan solas si no existen)
  const HERO = [
    {img:'hero1.jpg', h:'Tu fragancia, tu firma', p:'Descubrí nuestras fragancias femeninas', cat:'Fragancias Femeninas'},
    {img:'hero2.jpg', h:'Elegancia que se siente', p:'Fragancias masculinas premium', cat:'Fragancias Masculinas'},
    {img:'hero3.jpg', h:'Perfumería premium', p:'Envíos a todo el país · Comprá seguro', cat:''}
  ];
  const heroIdx = c => { const k=cats.indexOf(c); return k<0?'':'#cat'+k; };
  const hero = `<div class="hero" id="hero">
    ${HERO.map((s,k)=>`<div class="slide${k===0?' on':''}" style="background-image:url('/assets/${esc(slug)}/${s.img}')">
      <div class="cap"><h2>${esc(s.h)}</h2><p>${esc(s.p)}</p>${s.cat&&heroIdx(s.cat)?`<a href="${heroIdx(s.cat)}">Ver ${esc(s.cat)}</a>`:`<a href="#cat0">Ver productos</a>`}</div></div>`).join('')}
    <div class="dots">${HERO.map((s,k)=>`<i class="${k===0?'on':''}" data-k="${k}"></i>`).join('')}</div>
  </div>`;
  $('root').innerHTML = `
    <div class="topwrap">
      <div class="topbar"><b>ENVÍO GRATIS</b> En compras mayores a $100.000<span class="links"><a href="#">Contacto</a><a href="#">Sucursales</a></span></div>
      <div class="marquee"><span><i>Comprá antes de las 10 AM y recibilo el mismo día — válido de lunes a viernes excepto feriados</i><i>Comprá antes de las 10 AM y recibilo el mismo día — válido de lunes a viernes excepto feriados</i></span></div>
    </div>
    <header class="hd">${logo}</header>
    ${nav}
    ${hero}
    <div class="wrap">${sections}<div class="powered">Tienda impulsada por Praxis Personaliza</div></div>
    <div class="cartbar" id="cartbar">
      <div><strong id="cartCount">0</strong> <span class="muted">en el carrito</span> · <strong id="cartTotal">$0</strong></div>
      <button class="btn" onclick="openCheckout()">Finalizar compra</button>
    </div>
    <div class="modal-bg" id="custModal"><div class="sheet" id="custSheet"></div></div>
    <div class="modal-bg" id="checkoutModal"><div class="sheet" id="checkoutSheet"></div></div>`;
  initHero();
}

let heroTimer=null;
function initHero(){
  const hero=$('hero'); if(!hero) return;
  // Ocultar el hero si la primera imagen no existe (otros tenants sin fotos)
  const probe=new Image();
  probe.onerror=()=>{ hero.remove(); if(heroTimer)clearInterval(heroTimer); };
  probe.src=`/assets/${slug}/hero1.jpg`;
  const slides=[...hero.querySelectorAll('.slide')], dots=[...hero.querySelectorAll('.dots i')];
  let cur=0;
  const go=n=>{ cur=(n+slides.length)%slides.length; slides.forEach((s,k)=>s.classList.toggle('on',k===cur)); dots.forEach((d,k)=>d.classList.toggle('on',k===cur)); };
  dots.forEach(d=>d.onclick=()=>{ go(+d.dataset.k); restart(); });
  const restart=()=>{ if(heroTimer)clearInterval(heroTimer); heroTimer=setInterval(()=>go(cur+1),5000); };
  if(slides.length>1) restart();
}

let custIdx=null, custQty=1;
function openCust(i){ custIdx=i; custQty=1; const p=PRODUCTS[i];
  $('custSheet').innerHTML=`<h3>${esc(p.name)}</h3><p class="muted" style="margin-top:2px">${money(p.price)}${p.size_description?' · '+esc(p.size_description):''}</p>
    ${p.notes?`<p style="font-size:13px;color:var(--mut);line-height:1.5;margin-top:8px">${esc(p.notes)}</p>`:''}
    <label>Cantidad</label>
    <div class="qty"><button onclick="chQty(-1)">−</button><strong id="qv">1</strong><button onclick="chQty(1)">+</button></div>
    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn sec block" onclick="closeModal('custModal')">Cancelar</button>
      <button class="btn block" onclick="addToCart()">Agregar</button></div>`;
  $('custModal').classList.add('show');
}
function chQty(d){ custQty=Math.max(1,Math.min(20,custQty+d)); $('qv').textContent=custQty; }
function addToCart(){ const p=PRODUCTS[custIdx];
  cart.push({ productSlug:p.slug, product:p.name, text:'', qty:custQty, unitPrice:p.price, price:p.price*custQty });
  closeModal('custModal'); updateCart(); toast('Agregado al carrito');
}
function updateCart(){ const count=cart.reduce((a,i)=>a+i.qty,0); const total=cart.reduce((a,i)=>a+i.price,0);
  $('cartCount').textContent=count; $('cartTotal').textContent=money(total);
  $('cartbar').className='cartbar'+(cart.length?' show':'');
}
function closeModal(id){ $(id).classList.remove('show'); }

function openCheckout(){
  if(!cart.length) return;
  const rows=cart.map((it,i)=>`<div class="citem"><div>${esc(it.product)} <span class="muted">×${it.qty}</span></div><div>${money(it.price)} <button onclick="rmItem(${i})" class="btn sec" style="padding:2px 8px;margin-left:6px">✕</button></div></div>`).join('');
  const total=cart.reduce((a,i)=>a+i.price,0);
  $('checkoutSheet').innerHTML=`<h3>Finalizar compra</h3>
    <div style="margin:10px 0">${rows}<div class="citem" style="border:0"><strong>Total productos</strong><strong>${money(total)}</strong></div></div>
    <label>Nombre y apellido</label><input id="bName">
    <label>Email</label><input id="bEmail" type="email">
    <label>Teléfono</label><input id="bPhone">
    <label>Entrega</label>
    <select id="shipMethod" onchange="toggleShip()"><option value="retiro">Retiro / a coordinar</option><option value="andreani">Envío Andreani</option></select>
    <div id="shipFields" style="display:none">
      <div class="row2"><div><label>Código postal</label><input id="shipZip" maxlength="4"></div><div><label>Provincia</label><input id="shipProv"></div></div>
      <label>Dirección</label><input id="shipAddr"><label>Ciudad</label><input id="shipCity">
    </div>
    <div class="err" id="coErr"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn sec block" onclick="closeModal('checkoutModal')">Volver</button>
      <button class="btn block" id="payBtn" onclick="pay()">Ir a pagar</button></div>`;
  $('checkoutModal').classList.add('show');
}
function rmItem(i){ cart.splice(i,1); updateCart(); if(!cart.length){closeModal('checkoutModal');} else openCheckout(); }
function toggleShip(){ $('shipFields').style.display=$('shipMethod').value==='andreani'?'block':'none'; }

async function pay(){
  const err=$('coErr'); err.textContent='';
  const method=$('shipMethod').value;
  const buyer={ name:($('bName').value||'').trim(), email:($('bEmail').value||'').trim(), phone:($('bPhone').value||'').trim() };
  if(!buyer.name||!buyer.email){ err.textContent='Completá nombre y email.'; return; }
  const shipping={ method };
  if(method==='andreani'){ shipping.zip=($('shipZip').value||'').trim(); shipping.province=($('shipProv').value||'').trim(); shipping.address=($('shipAddr').value||'').trim(); shipping.city=($('shipCity').value||'').trim();
    if(!/^\d{4}$/.test(shipping.zip)){ err.textContent='Ingresá un código postal válido (4 dígitos).'; return; } }
  const cartItems=cart.map(it=>({ productSlug:it.productSlug, text:it.text, qty:it.qty }));
  $('payBtn').disabled=true; $('payBtn').textContent='Procesando…';
  try{
    const r=await fetch('/api/create-preference',{ method:'POST', headers:{'Content-Type':'application/json','X-Tenant':slug}, body:JSON.stringify({buyer,shipping,cartItems}) });
    const d=await r.json();
    if(!r.ok||!d.initPoint){ throw new Error(d.error||'No se pudo iniciar el pago'); }
    location.href=d.initPoint;
  }catch(e){ err.textContent=e.message; $('payBtn').disabled=false; $('payBtn').textContent='Ir a pagar'; }
}

init();
</script>
</body>
</html>
